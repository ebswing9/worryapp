<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 고민 나누기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
<div class="wrap" style="max-width:400px; padding-top:70px;">
  <div class="login-hero">
    <div class="login-emoji">🌷</div>
    <h1 class="brand-title">우리반<br>고민 나누기</h1>
    <p class="brand-sub">마음을 살짝 꺼내놓아 볼까요?</p>
  </div>
  <div class="card">
    <label>아이디</label>
    <input type="text" id="username" placeholder="예: student01">
    <label>비밀번호</label>
    <input type="password" id="password">
    <p id="error-msg" style="color:#ff5b6e; display:none;"></p>
    <button id="login-btn" style="width:100%;">로그인 ✨</button>
  </div>
  <p class="muted" style="text-align:center;">계정은 선생님이 미리 만들어드립니다.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
